<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
  <!-- Title & Description -->
  <title>[##cms.seo.title|(More and Easy Travel Agency)##]</title>
  <meta name="description"
    content="[##cms.seo.description|(بهترین و آسان ترین سفر را با آژانس مسافرتی More and Easy تجربه کنید.)##]">
  <!-- Title & Description -->
  <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
    <member type="list" name="list" request="taglist" preview=""></member>
  </basis>
  <basis core="print" datamembername="tag.list">
    <face filter="key = 'canonical'">
      <link rel="canonical" href="@value" />
    </face>
    <face>
      <meta property="@key" content="@value" />
    </face>
  </basis>
  <!-- pwa metatags -->
  <basis core="call" file="pwa.inc" lid="1" pageindex="[##cms.cms.pageindex##]" />
  <!-- common styles for all page -->
  <link rel="stylesheet" href="[##cms.cms.cdn##]/_css/swiper-bundle.min.css" />
  <basis core="call" file="style.inc" lid="1" pageindex="[##cms.cms.pageindex##]" />
</head>

<body>

  <basis core="call" file="header.inc" lid="1" pageindex="[##cms.cms.pageindex##]" />

  <main>
    <section class="mt-6">
      <div class="relative text-center">
        <basis core="list" datamembername="db.contact-images">
          <face>
            <div class="w-full">
              <img src="/@largeIMG" alt="@name" class="object-cover w-full h-72 img-responsive" width="320" height="281"
                loading="lazy" />
            </div>
          </face>
        </basis>
        <div
          class="absolute flex justify-center items-center flex-col m-auto inset-0 h-[90%] bg-[#284E6526] border border-white border-solid rounded-lg max-lg:w-[95%]">
          <basis core="view" datamembername="db.view">
            <face filter="TypeID in(150)">
              <h1 class="mb-2 font-bold text-white">
                @text
              </h1>
            </face>
          </basis>

          <div class="text-sm text-white">
            <a href="/FA">صفحه اصلی /</a> درباره ما
          </div>
        </div>
      </div>
    </section>
    <section class="mt-4">
      <basis core="print" datamembername="db.info">
        <layout>
          <div class="px-4">
            @child
          </div>
        </layout>
        <face filter="TypeID in(150)">
          <h2 class="font-bold text-primary-800">@text</h2>
        </face>
        <face filter="TypeID in(144)">
          <div class="mt-2 text-sm text-justify text-zinc-800">
            @largetext
          </div>
        </face>
      </basis>

      <basis core="print" datamembername="db.persons">
        <layout>
          <div class="mt-6 flex flex-col gap-2 max-lg:w-[95%] mx-auto">
            @child
          </div>
        </layout>
        <face>
          <div class="relative">
            <img src="@00580X00236prp" alt="@title" width="100%" height="236">
            <div class="absolute text-xs top-[40%] right-[5%]">
              <span class="block">
                تلفن:
              </span>
              <a href="tel:@prp_3087812" class="block font-bold custom-red">
                @prp_3087812
              </a>
              <span class="block">
                ایمیل:
              </span>
              <a href="mailto:@prp_3087813" class="block font-bold break-words custom-red">
                @prp_3087813
              </a>
            </div>
          </div>
        </face>
      </basis>

      <basis core="print" datamembername="db.view">
        <layout>
          <div class="rounded-lg overflow-hidden mt-4 max-lg:w-[95%] mx-auto">
            @child
          </div>
        </layout>
        <face filter="valueID in(4108440)">
          <iframe width="100%" height="300" class="h-auto aspect-video" src="@text" allowfullscreen="true"
            webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
        </face>
      </basis>
    </section>
    <section class="mt-4 max-lg:w-[95%] mx-auto">
      <h2 class="font-bold mb-7 text-primary-800">درباره ما</h2>
      <div>
        <div class="flex items-center gap-4">
          <img src="[##cms.cms.cdn##]/images/adress icon.svg" alt="addessIcon"
            class="self-start object-cover rounded-xl" width="60" height="60" loading="lazy" />
          <div class="flex flex-col gap-2">
            <span class="font-bold text-primary-800">ترکیه، استانبول</span>
            <basis core="print" datamembername="db.info">
              <face filter="TypeID in(244)">
                <div class="text-sm text-zinc-700">@largetext</div>
              </face>
            </basis>
          </div>
        </div>
        <div class="flex flex-col mt-9 gap-9">
          <div class="flex items-center gap-4">
            <img src="[##cms.cms.cdn##]/images/adress icon.svg" alt="addessIcon" class="object-cover rounded-xl"
              width="60" height="60" loading="lazy" />
            <div class="flex flex-col gap-2">
              <span class="font-bold text-primary-800">تماس با ما</span>
              <basis core="print" datamembername="db.info">
                <face filter="valueID in(4083837)">
                  <a href="tel:@text" class="text-sm text-zinc-700 hover:text-secondary-600">@text</a>
                </face>
              </basis>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="after:content-emailFooter"></div>
            <div class="flex flex-col gap-2">
              <span class="font-bold text-primary-800">ایمیل</span>
              <basis core="print" datamembername="db.info">
                <face filter="TypeID in(242)">
                  <a href="mailto:@text" class="text-sm text-zinc-700 hover:text-secondary-600">@text</a>
                </face>
              </basis>
            </div>
          </div>
        </div>
      </div>
      <basis core="print" datamembername="db.info">
        <layout>
          <div class="my-6">@child</div>
        </layout>
        <face filter="prpID=91462"><iframe defer title="More and Easy location" class="h-[332px] w-full rounded-lg"
            height="332" loading="lazy" target="_blank" allowfullscreen
            src="https://maps.google.com/maps?q=@text,@largetext&z=14&output=embed"></iframe></face>
      </basis>
    </section>
    <section class="mb-14">
      <basis core="print" datamembername="db.pView">
        <layout>
          <div class="px-4">
            @child
          </div>
        </layout>
        <face filter="TypeID in(150)">
          <h2 class="font-bold text-primary-800">@text</h2>
        </face>
        <face filter="TypeID in(129)">
          <div class="mt-2 text-sm text-justify text-zinc-800">
            @largetext
          </div>
        </face>
      </basis>

    </section>

  </main>

  <basis core="call" file="footer.inc" lid="1" pageindex="[##cms.cms.pageindex##]" />
</body>

</html>
